
services:
  postgres:
    image: postgres:17
    container_name: commerceflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: commerceflow
      POSTGRES_USER: commerceflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceflow -d commerceflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
